services:
  db:
    image: postgres:16-alpine
    container_name: mediflow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: mediflow
      POSTGRES_PASSWORD: mediflow
      POSTGRES_DB: mediflow
    ports:
      - "5432:5432"
    volumes:
      - mediflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mediflow -d mediflow"]
      interval: 3s
      timeout: 5s
      retries: 20

  adminer:
    image: adminer:latest
    container_name: mediflow-adminer
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db

volumes:
  mediflow_pgdata:
